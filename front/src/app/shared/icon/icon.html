@switch (name()) {
  @case ('shield') {
    <svg
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <!-- Contour du bouclier -->
      <path
        d="M12 3 L19.5 6 V11 C19.5 15.5 16.5 19.5 12 21 C7.5 19.5 4.5 15.5 4.5 11 V6 Z"
        stroke="currentColor"
        stroke-width="1.5"
        fill="none"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      <!-- Coche -->
      <path
        d="M8.5 12 L11 14.5 L15.5 9.5"
        stroke="currentColor"
        stroke-width="1.5"
        fill="none"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
    </svg>
  }

  @case ('bolt') {
    <svg
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"
        stroke="currentColor"
        stroke-width="1.5"
        fill="none"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
    </svg>
  }

  @case ('palette') {
    <svg
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <!-- Contour de palette de peintre -->
      <path
        d="M4 9 Q4 5 7 4 Q14 2 19 4 Q22 5 22 9 Q22 13 20 15 Q18 17 13 17 Q8 17 6 15 Q4 13 4 9 Z"
        stroke="currentColor"
        stroke-width="1.5"
        fill="none"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      <!-- Trou de pouce -->
      <circle cx="7" cy="14" r="1.2" stroke="currentColor" stroke-width="1.5" fill="none" />
      <!-- Petits cercles de peinture -->
      <circle cx="8" cy="8" r="0.8" stroke="currentColor" stroke-width="1.5" fill="none" />
      <circle cx="12" cy="6" r="0.8" stroke="currentColor" stroke-width="1.5" fill="none" />
      <circle cx="17" cy="9" r="0.8" stroke="currentColor" stroke-width="1.5" fill="none" />
    </svg>
  }

  @case ('logo') {
    <svg
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <!-- Plateau du mortarboard en losange -->
      <path
        d="M12 4 L2 9 L12 14 L22 9 Z"
        stroke="currentColor"
        stroke-width="1.5"
        fill="none"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      <!-- Calotte du mortarboard -->
      <path
        d="M6 11.5 V16 c0 1.5 3 3 6 3 s6-1.5 6-3 V11.5"
        stroke="currentColor"
        stroke-width="1.5"
        fill="none"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      <!-- Gland à droite -->
      <line
        x1="22"
        y1="9"
        x2="22"
        y2="15"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>
  }

  @case ('lock') {
    <svg
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <rect
        x="6"
        y="10"
        width="12"
        height="10"
        rx="1.5"
        stroke="currentColor"
        stroke-width="1.5"
        fill="none"
      />
      <path
        d="M9 10V7c0-1.66 1.34-3 3-3s3 1.34 3 3v3"
        stroke="currentColor"
        stroke-width="1.5"
        fill="none"
      />
      <circle cx="12" cy="15" r="0.75" fill="currentColor" />
    </svg>
  }
}
