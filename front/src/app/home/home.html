<main class="home-main">
  <!-- Panneau de marque et présentation (zone gauche sur desktop, haut sur mobile) -->
  <section class="home-brand-panel">
    <div class="brand-content">
      <h2 class="app-name">Angular Training</h2>
      <p class="app-tagline">
        Une plateforme de formation moderne et sécurisée pour maîtriser les meilleures pratiques de
        développement fullstack
      </p>

      <!-- Points forts de l'application -->
      <ul class="strength-points-list" data-testid="strength-points-list">
        @for (point of strengthPoints; track point.title) {
          <li class="strength-point-item" data-testid="strength-point">
            <div class="strength-icon">
              <i [class]="'pi ' + point.icon" aria-hidden="true"></i>
            </div>
            <div class="strength-text">
              <h3 class="strength-title">{{ point.title }}</h3>
              <p class="strength-description">{{ point.description }}</p>
            </div>
          </li>
        }
      </ul>
    </div>
  </section>

  <!-- Carte de connexion (zone droite sur desktop, bas sur mobile) -->
  <section class="home-login-card">
    <div class="card-content">
      <h1 class="login-title">Connexion</h1>
      <app-login-form />
    </div>
  </section>
</main>
